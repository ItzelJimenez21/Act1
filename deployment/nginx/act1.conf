# ============================================================
# ZERO TRUST - NGINX
# Frontend React + Reverse Proxy privado + Security Headers
# ============================================================

# ------------------------------------------------------------
# LOG ESPECIAL PARA FAIL2BAN
# ------------------------------------------------------------

log_format act1_auth '$remote_addr - $status "$request"';

server {
    listen 80;
    listen [::]:80;

    # ========================================================
    # IMPORTANTE:
    # Cuando tengamos el dominio real, reemplazaremos "_"
    # por algo como:
    #
    # server_name tudominio.com www.tudominio.com;
    #
    # Antes de ejecutar Certbot.
    # ========================================================

    server_name _;

    # --------------------------------------------------------
    # FRONTEND REACT
    # --------------------------------------------------------

    root /var/www/act1/frontend/dist;
    index index.html;

    # Logs generales
    access_log /var/log/nginx/act1_access.log;
    error_log /var/log/nginx/act1_error.log;

    # Log que analizará Fail2Ban
    access_log /var/log/nginx/act1_auth.log act1_auth;

    # --------------------------------------------------------
    # SECURITY HEADERS
    # --------------------------------------------------------

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self';" always;

    # --------------------------------------------------------
    # REACT SPA
    # --------------------------------------------------------

    location / {
        try_files $uri $uri/ /index.html;
    }

    # --------------------------------------------------------
    # BACKEND PRIVADO
    # --------------------------------------------------------
    #
    # Planearemos inicialmente que la EC2 Backend tenga:
    # 10.0.1.10
    #
    # Si AWS asigna otra IP privada, cambiaremos este valor.
    #
    # El navegador NO accede directamente al Backend.
    # Nginx recibe /api y lo reenvía mediante VPC Peering.
    # --------------------------------------------------------

    location /api/ {
        proxy_pass http://10.0.1.10:3000;

        proxy_http_version 1.1;

        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;

        proxy_buffering off;
    }

    # --------------------------------------------------------
    # ARCHIVOS OCULTOS
    # --------------------------------------------------------

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # --------------------------------------------------------
    # ARCHIVOS SENSIBLES
    # --------------------------------------------------------

    location ~* \.(env|log|ini|conf|bak|sql)$ {
        deny all;
    }

    # --------------------------------------------------------
    # LÍMITE DE TAMAÑO DE SOLICITUD
    # --------------------------------------------------------

    client_max_body_size 10k;
}