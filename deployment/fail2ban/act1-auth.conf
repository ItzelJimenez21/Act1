[Definition]

# ============================================================
# ZERO TRUST - FILTRO DE AUTENTICACIÓN
# ============================================================
#
# Detecta respuestas HTTP 401 y 429 generadas durante
# intentos de inicio de sesión contra /api/auth/login.
#
# El formato del log de Nginx será:
#
# IP - STATUS "REQUEST"
#
# Ejemplo:
# 203.0.113.25 - 401 "POST /api/auth/login HTTP/1.1"
#

failregex = ^<HOST> - (?:401|429) "POST /api/auth/login HTTP/\d(?:\.\d)?"$

ignoreregex =